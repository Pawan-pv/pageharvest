<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cards With Missing Fields - PageHarvest Fixture</title>
</head>
<body>
  <h1>Cards With Missing Fields</h1>
  <div class="catalog-grid">
    <!-- Complete card, so that every field is discovered. -->
    <article class="catalog-card">
      <h3 class="card-name">Complete Lamp</h3>
      <span class="card-price">$10.00</span>
      <img class="card-image" src="/img/lamp.png" alt="Lamp">
    </article>
    <!-- Missing price -->
    <article class="catalog-card">
      <h3 class="card-name">Priceless Chair</h3>
      <img class="card-image" src="/img/chair.png" alt="Chair">
    </article>
    <!-- Missing name -->
    <article class="catalog-card">
      <span class="card-price">$30.00</span>
      <img class="card-image" src="/img/desk.png" alt="Desk">
    </article>
    <!-- Missing several fields -->
    <article class="catalog-card">
      <span class="card-price">$40.00</span>
    </article>
    <!-- Complete card in the middle -->
    <article class="catalog-card">
      <h3 class="card-name">Complete Shelf</h3>
      <span class="card-price">$50.00</span>
      <img class="card-image" src="/img/shelf.png" alt="Shelf">
    </article>
    <!-- Missing image, and the last card -->
    <article class="catalog-card">
      <h3 class="card-name">Imageless Rug</h3>
      <span class="card-price">$60.00</span>
    </article>
  </div>
</body>
</html>
