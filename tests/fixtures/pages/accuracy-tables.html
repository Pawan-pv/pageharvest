<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tables - PageHarvest Fixture</title>
</head>
<body>
<h1>Tables</h1>
<h2>Team scores</h2>
<table id="scores">
  <caption>Team scores</caption>
  <thead><tr><th>Team</th><th>City</th><th colspan="2">Score</th></tr></thead>
  <tbody>
    <tr><td>Ants</td><td rowspan="2">Oslo</td><td>1</td><td>2</td></tr>
    <tr><td>Bees</td><td>3</td><td>4</td></tr>
  </tbody>
  <tbody>
    <tr><th colspan="4">Second division</th></tr>
    <tr><td>Cats</td><td>Rome</td><td></td><td>6</td></tr>
    <tr><td colspan="2">Dogs of Lyon</td><td>7</td><td>8</td></tr>
  </tbody>
  <tfoot><tr><td>Total</td><td></td><td>11</td><td>20</td></tr></tfoot>
</table>
<h2>No headers</h2>
<table id="plain">
  <tr><td>alpha</td><td>one</td></tr>
  <tr><td>beta</td><td>two</td></tr>
</table>
</body>
</html>
