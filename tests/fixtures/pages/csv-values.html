<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSV Value Classes - PageHarvest Fixture</title>
</head>
<body>
  <h1>CSV Value Classes</h1>
  <ul class="value-list">
    <li class="value-row"><span class="kind">negative</span><span class="val">-5</span></li>
    <li class="value-row"><span class="kind">negative decimal</span><span class="val">-12.50</span></li>
    <li class="value-row"><span class="kind">positive signed</span><span class="val">+5</span></li>
    <li class="value-row"><span class="kind">zero</span><span class="val">0</span></li>
    <li class="value-row"><span class="kind">sum formula</span><span class="val">=SUM(A1:A5)</span></li>
    <li class="value-row"><span class="kind">command</span><span class="val">+cmd|' /C calc'!A0</span></li>
    <li class="value-row"><span class="kind">minus formula</span><span class="val">-2+3+cmd|' /C calc'!A0</span></li>
    <li class="value-row"><span class="kind">at formula</span><span class="val">@SUM(A1)</span></li>
    <li class="value-row"><span class="kind">quotes</span><span class="val">He said "Hi"</span></li>
    <li class="value-row"><span class="kind">comma</span><span class="val">Hello, World</span></li>
    <li class="value-row"><span class="kind">unicode</span><span class="val">Café 日本語 ₹1299</span></li>
  </ul>
</body>
</html>
