<script>
  // Moves the real address into src only when the image comes into view, and removes the
  // attribute, as lazy-loading libraries do.
  const observer = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (entry.isIntersecting) {
        entry.target.src = entry.target.dataset.pending;
        entry.target.removeAttribute('data-pending');
        observer.unobserve(entry.target);
      }
    }
  });
  document.querySelectorAll('img.lazy').forEach((image) => observer.observe(image));
</script>
