<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Prices - PageHarvest Fixture</title>
</head>
<body>
<h1>Mixed price formats</h1>
<div class="offers">
  <div class="offer"><h3>European amount</h3><span class="price">€1.234,56</span></div>
  <div class="offer"><h3>Spaced amount</h3><span class="price">1&nbsp;234,56&nbsp;€</span></div>
  <div class="offer"><h3>US amount</h3><span class="price">$1,299.00</span></div>
  <div class="offer"><h3>Salary range</h3><span class="price">$150,000 - $185,000 / yr</span></div>
  <div class="offer"><h3>Ambiguous amount</h3><span class="price">€1.234</span></div>
  <div class="offer"><h3>Bundle offer</h3><span class="price">2 for $10</span></div>
  <div class="offer"><h3>Refund</h3><span class="price">-$25.50</span></div>
</div>
</body>
</html>
