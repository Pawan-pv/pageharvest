<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Missing Prices - PageHarvest Fixture</title>
</head>
<body>
  <h1>Inventory with Missing / Discontinued Prices</h1>
  <ul class="inventory-list">
    <li class="inventory-item">
      <h3 class="name">Product Alpha</h3>
      <span class="price">$19.99</span>
    </li>
    <li class="inventory-item">
      <h3 class="name">Product Beta</h3>
      <span class="badge out-of-stock">Out of Stock</span>
      <!-- Notice: No .price element -->
    </li>
    <li class="inventory-item">
      <h3 class="name">Product Gamma</h3>
      <span class="price">Contact for pricing</span>
    </li>
    <li class="inventory-item">
      <h3 class="name">Product Delta</h3>
      <span class="price">$0.00 (Free Trial)</span>
    </li>
  </ul>
</body>
</html>
