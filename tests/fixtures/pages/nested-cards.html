<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nested Product Cards - PageHarvest Fixture</title>
</head>
<body>
  <h1>Product Bundles (Nested Cards)</h1>
  <div class="bundle-container">
    <!-- Bundle 1 -->
    <div class="bundle-card" data-bundle-id="b1">
      <h2 class="bundle-title">Gaming Setup Bundle Ultimate</h2>
      <span class="bundle-price">$899.00</span>
      <div class="bundle-items">
        <div class="nested-item" data-sku="NEST-01">
          <span class="nested-name">Mechanical Keyboard RGB</span>
          <span class="nested-individual-price">$99.00</span>
        </div>
        <div class="nested-item" data-sku="NEST-02">
          <span class="nested-name">Precision Wireless Mouse</span>
          <span class="nested-individual-price">$59.00</span>
        </div>
        <div class="nested-item" data-sku="NEST-03">
          <span class="nested-name">27-inch 165Hz Monitor</span>
          <span class="nested-individual-price">$299.00</span>
        </div>
      </div>
    </div>

    <!-- Bundle 2 -->
    <div class="bundle-card" data-bundle-id="b2">
      <h2 class="bundle-title">Work From Home Essentials</h2>
      <span class="bundle-price">$450.00</span>
      <div class="bundle-items">
        <div class="nested-item" data-sku="NEST-04">
          <span class="nested-name">Ergonomic Office Chair</span>
          <span class="nested-individual-price">$250.00</span>
        </div>
        <div class="nested-item" data-sku="NEST-05">
          <span class="nested-name">Dual Monitor Arm</span>
          <span class="nested-individual-price">$75.00</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
