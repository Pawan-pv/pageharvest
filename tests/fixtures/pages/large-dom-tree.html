<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Large Catalog - Performance Fixture</title>
</head>
<body>
  <div class="large-container">
    <header>
      <h1>Mega Catalog (High Element Count)</h1>
    </header>
    <div id="catalog-grid" class="catalog-grid">
      <!-- 50 pre-rendered cards; test suite can dynamically inject up to 1,000 -->
      <div class="catalog-card" data-index="0">
        <h3 class="card-title">Catalog Item #0</h3>
        <span class="card-price">$19.99</span>
        <a class="card-link" href="/item/0">Details</a>
      </div>
      <div class="catalog-card" data-index="1">
        <h3 class="card-title">Catalog Item #1</h3>
        <span class="card-price">$29.99</span>
        <a class="card-link" href="/item/1">Details</a>
      </div>
      <div class="catalog-card" data-index="2">
        <h3 class="card-title">Catalog Item #2</h3>
        <span class="card-price">$39.99</span>
        <a class="card-link" href="/item/2">Details</a>
      </div>
      <div class="catalog-card" data-index="3">
        <h3 class="card-title">Catalog Item #3</h3>
        <span class="card-price">$49.99</span>
        <a class="card-link" href="/item/3">Details</a>
      </div>
      <div class="catalog-card" data-index="4">
        <h3 class="card-title">Catalog Item #4</h3>
        <span class="card-price">$59.99</span>
        <a class="card-link" href="/item/4">Details</a>
      </div>
    </div>
  </div>
</body>
</html>
