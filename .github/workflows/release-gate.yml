name: Release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate WXT types
        run: pnpm compile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Extensions need a headed browser, so the browser tests run on a virtual display.
      - name: Run the release gate
        run: xvfb-run --auto-servernum pnpm test:release:automated

      - name: Add the report to the run summary
        if: always()
        run: |
          if [ -f artifacts/release-test-report.md ]; then
            cat artifacts/release-test-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Reported, not enforced: there is no agreed target yet, only a baseline.
      - name: Measure test coverage
        if: always() && github.event_name != 'push'
        run: |
          pnpm exec vitest run --coverage --coverage.reporter=json-summary --coverage.reporter=text-summary --coverage.reportsDirectory=artifacts/coverage
          node -e "const t=require('./artifacts/coverage/coverage-summary.json').total;console.log(JSON.stringify(t,null,1))"

      - name: Measure performance
        if: always() && github.event_name != 'push'
        run: pnpm benchmark:performance

      - name: Upload the report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  # Clicks the real browser toolbar and uses the real side panel, which needs a desktop.
  # A BLOCKED result exits 3 and fails this job, so green means it really was verified.
  native-side-panel:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install toolbar automation
        run: pip install pywinauto==0.6.8 pillow==10.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the extension
        run: pnpm build

      - name: Install Chrome for Testing
        run: pnpm exec playwright install chromium

      - name: Verify the native side panel
        run: pnpm test:release:chrome

      - name: Add the report to the run summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/release-test-report.md ]; then
            cat artifacts/release-test-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-side-panel
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
