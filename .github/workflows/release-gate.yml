name: Release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate WXT types
        run: pnpm compile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Extensions need a headed browser, so the browser tests run on a virtual display.
      # The native Chrome check cannot run here. It reports BLOCKED and the gate exits 3,
      # which must stay visible as a warning instead of reading as a verified result.
      - name: Run the release gate
        run: |
          set +e
          xvfb-run --auto-servernum pnpm test:release
          code=$?
          set -e
          if [ -f artifacts/release-test-report.md ]; then
            cat artifacts/release-test-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -eq 3 ]; then
            echo "::warning title=Native side panel not verified::CI cannot click the Chrome toolbar. Follow the manual procedure in docs/FEATURE_AUDIT.md."
            exit 0
          fi
          exit "$code"

      - name: Upload the report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
