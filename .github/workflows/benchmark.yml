name: Real-site benchmark

# Manual only. It visits third-party practice sites, so it must never run on every push.
on:
  workflow_dispatch:
    inputs:
      site_ids:
        description: >-
          Space-separated IDs from tests/benchmark/sites.json. Leave empty to run the full allowlist.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the extension
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the benchmark
        env:
          SITE_IDS: ${{ inputs.site_ids }}
        run: |
          if [ -n "$SITE_IDS" ]; then
            read -r -a ids <<< "$SITE_IDS"
            xvfb-run --auto-servernum pnpm benchmark:sites "${ids[@]}"
          else
            xvfb-run --auto-servernum pnpm benchmark:sites
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-site-benchmark
          path: artifacts/benchmark/
          if-no-files-found: warn
          retention-days: 30
