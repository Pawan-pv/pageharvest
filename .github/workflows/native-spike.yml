name: Native side panel spike

on:
  push:
    branches: [ci/native-side-panel]

permissions:
  contents: read

jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pywinauto==0.6.8 pillow==10.4.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: node scripts/release-testing/native-spike.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike
          path: artifacts/spike/
          if-no-files-found: warn
          retention-days: 7
